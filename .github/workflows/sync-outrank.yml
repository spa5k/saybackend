name: Sync Outrank guides

# Cloudflare Workers Builds deploys the site and pulls Outrank articles at build
# time. This job asks Cloudflare for a fresh build daily so new articles go live.
on:
  schedule:
    - cron: '35 18 * * *' # daily, 18:35 UTC = 00:05 IST, so a post goes out at the start of its IST day
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Trigger Cloudflare build
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Set the CLOUDFLARE_DEPLOY_HOOK secret to the Workers Builds deploy hook URL."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"
      # Builds finish in ~5 minutes; then submit the sitemap so new and changed
      # guides reach IndexNow search engines.
      - name: Wait for deploy
        run: sleep 360
      - name: Ping IndexNow
        run: node scripts/ping-indexnow.mjs
