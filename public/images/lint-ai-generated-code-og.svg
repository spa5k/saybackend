<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" fill="none" role="img" aria-labelledby="title desc" viewBox="0 0 1200 630">
  <title id="title">How to lint AI-generated code and keep it somewhat slop-free</title>
  <desc id="desc">SayBackend editorial poster showing an AI agent moving through Oxlint and TypeScript, with measured lint policy counts.</desc>
  <metadata>
    Oxc mark sourced from oxc-project/oxc-project.github.io public/logo-without-border.svg.
    TypeScript mark sourced from microsoft/TypeScript-Website static/branding/ts-logo-512.svg.
  </metadata>
  <defs>
    <linearGradient id="warm" x1="0" x2="1200" y1="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAF9F6"/>
      <stop offset="1" stop-color="#F3F5F4"/>
    </linearGradient>
    <filter id="softShadow" width="140%" height="150%" x="-20%" y="-20%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" flood-color="#171714" flood-opacity=".08" stdDeviation="13"/>
    </filter>
    <pattern id="microGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path stroke="#171714" stroke-opacity=".035" d="M28 0H0V28"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#warm)"/>
  <rect width="1200" height="630" fill="url(#microGrid)"/>
  <circle cx="1035" cy="111" r="184" fill="#3178C6" opacity=".055"/>
  <circle cx="770" cy="560" r="172" fill="#FF5B00" opacity=".045"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="80" y="82" fill="#171714" font-size="26" font-weight="800" letter-spacing="3">BLOG—18</text>

    <text x="80" y="160" fill="#171714" font-size="49" font-weight="900" letter-spacing="-1.6">HOW TO LINT</text>
    <text x="80" y="226" fill="#FF5B00" font-size="57" font-weight="900" letter-spacing="-2.2">AI-GENERATED</text>
    <text x="80" y="288" fill="#171714" font-size="57" font-weight="900" letter-spacing="-2.2">CODE</text>
    <text x="80" y="345" fill="#171714" font-size="43" font-weight="900" letter-spacing="-1.4">KEEP IT SOMEWHAT</text>
    <text x="80" y="414" fill="#171714" font-size="64" font-weight="900" letter-spacing="-2.4">SLOP-FREE</text>
    <path stroke="#FF5B00" stroke-linecap="round" stroke-width="7" d="M81 435h330"/>
    <path fill="#FF5B00" d="m410 425 19 10-19 10z"/>

    <text x="692" y="80" fill="#171714" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" letter-spacing="2.2">GENERATION → ENFORCEMENT</text>

    <g filter="url(#softShadow)">
      <rect width="122" height="122" x="692" y="116" fill="#FFF" stroke="#D9D7D0" stroke-width="2" rx="22"/>
      <rect width="122" height="122" x="849" y="116" fill="#111827" rx="22"/>
      <rect width="122" height="122" x="1006" y="116" fill="#3178C6" rx="22"/>
