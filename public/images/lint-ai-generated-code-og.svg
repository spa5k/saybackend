    <path fill="#171714" d="m998 171 10 6-10 6z"/>

    <text x="753" y="266" fill="#6D6C66" font-size="13" font-weight="800" letter-spacing="1.8" text-anchor="middle">AGENT</text>
    <text x="910" y="266" fill="#6D6C66" font-size="13" font-weight="800" letter-spacing="1.8" text-anchor="middle">OXLINT</text>
    <text x="1067" y="266" fill="#6D6C66" font-size="13" font-weight="800" letter-spacing="1.8" text-anchor="middle">TYPES</text>

    <g transform="translate(692 304)">
      <rect width="436" height="230" fill="#171714" rx="22"/>
      <text x="28" y="38" fill="#FFF" font-size="17" font-weight="800" letter-spacing="1.8">POLICY, MEASURED</text>
      <path stroke="#FFF" stroke-opacity=".16" d="M28 57h380"/>

      <text x="28" y="102" fill="#FF5B00" font-size="34" font-weight="900">28</text>
      <text x="103" y="92" fill="#FFF" font-size="14" font-weight="800" letter-spacing="1.2">ZERO-HIT RULES</text>
      <text x="103" y="113" fill="#AAA8A0" font-size="14">promote directly to error</text>

      <text x="28" y="157" fill="#6CAFF0" font-size="31" font-weight="900">1,977</text>
      <text x="132" y="147" fill="#FFF" font-size="14" font-weight="800" letter-spacing="1.2">EXISTING FINDINGS</text>
      <text x="132" y="168" fill="#AAA8A0" font-size="14">warnings plus a touched-file ratchet</text>

      <text x="28" y="203" fill="#32F3EF" font-size="31" font-weight="900">15</text>
      <text x="103" y="193" fill="#FFF" font-size="14" font-weight="800" letter-spacing="1.2">VENDORED RULES</text>
      <text x="103" y="214" fill="#AAA8A0" font-size="14">read, count, then adapt</text>
    </g>

    <rect width="560" height="108" x="54" y="500" fill="#FF5B00"/>
    <rect width="560" height="108" x="62" y="488" fill="#171714"/>
    <text x="342" y="557" fill="#FFF" font-size="58" font-weight="900" text-anchor="middle">SayBackend</text>
    <text x="910" y="585" fill="#171714" font-size="14" font-weight="800" letter-spacing="1.5" text-anchor="middle">LINT THE PATTERN · REVIEW THE INTENT</text>
  </g>
