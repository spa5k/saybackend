  <text x="80" y="362" fill="#191c19" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-1">SO THE RULES CHANGED</text>
  <rect x="716" y="150" width="2" height="330" fill="#d9d5c8"/>
  
    <text x="760" y="196" fill="#667068" font-family="Menlo, SFMono-Regular, ui-monospace, monospace" font-size="20" letter-spacing="2">WEB INSTANCE · ONE CHECKOUT</text>
